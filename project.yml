name: GreenRoom
options:
  bundleIdPrefix: com.greenroomformac
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: YES
    DEVELOPMENT_TEAM: KPQU8X839X
    CODE_SIGN_STYLE: Automatic
    DEAD_CODE_STRIPPING: YES
packages:
  GreenRoomCore:
    path: Packages/GreenRoomCore
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: "2.10.0"
targets:
  GreenRoom:
    type: application
    platform: macOS
    sources:
      - GreenRoom
    dependencies:
      - package: GreenRoomCore
      - package: Sparkle
      # The `greenroom` command; the Homebrew cask links it onto the PATH.
      - target: GreenRoomCLI
        copy:
          destination: executables
        codeSignOnCopy: true
    entitlements:
      path: GreenRoom/GreenRoom.entitlements
      properties:
        com.apple.security.device.camera: true
        com.apple.security.device.audio-input: true
        com.apple.security.personal-information.calendars: true
    info:
      path: GreenRoom/Info.plist
      properties:
        CFBundleDisplayName: Green Room
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: Copyright © 2026 Corey Haines. FSL-1.1-MIT.
        NSCameraUsageDescription: Green Room shows a live preview so you can check your camera before a call. Video never leaves your Mac and is never saved.
        NSMicrophoneUsageDescription: Green Room shows a level meter so you can check your microphone before a call. Audio never leaves your Mac and is never saved.
        NSCalendarsFullAccessUsageDescription: Green Room checks your devices before calendar calls and can hold notifications during them. It reads event times and video-call links and never changes your calendar.
        SUFeedURL: https://github.com/coreyhaines31/greenroom/releases/latest/download/appcast.xml
        SUPublicEDKey: 5MTMTktA0NUipG5n3iJy+27VbXN9uKgO2BbCgK8yUKU=
        SUEnableAutomaticChecks: true
    settings:
      base:
        PRODUCT_NAME: Green Room
        PRODUCT_MODULE_NAME: GreenRoom
        PRODUCT_BUNDLE_IDENTIFIER: com.greenroomformac.GreenRoom
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  GreenRoomCLI:
    type: tool
    platform: macOS
    sources: [GreenRoomCLI]
    dependencies:
      - package: GreenRoomCore
    settings:
      base:
        PRODUCT_NAME: greenroom
        PRODUCT_BUNDLE_IDENTIFIER: com.greenroomformac.GreenRoom.CLI
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: YES
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        INFOPLIST_KEY_CFBundleShortVersionString: $(MARKETING_VERSION)
schemes:
  GreenRoom:
    build:
      targets:
        GreenRoom: all
    test:
      targets:
        - package: GreenRoomCore/GreenRoomCoreTests
